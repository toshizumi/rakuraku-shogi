<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>らくらく将棋 - 超強化AI版</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; touch-action: manipulation; user-select: none; }
  input { user-select: text; -webkit-user-select: text; }
  :root {
    --bg: #f4ece1;
    --board-bg: #e2b071;
    --board-frame: #5c3a21;
    --board-glow: 0 4px 8px rgba(0,0,0,0.25);
    --title: #333;
    /* 盤の一辺。幅92%・最大450px・画面の高さから上下の情報分(230px)を引いた値の小さい方。下限280px */
    --board-size: min(92vw, 450px, max(280px, calc(100vh - 230px)));
    --board-size: min(92vw, 450px, max(280px, calc(100dvh - 230px)));
  }
  body {
    font-family: "Hiragino Kaku Gothic ProN", "メイリオ", sans-serif;
    background-color: var(--bg);
    margin: 0; padding: 6px 10px;
    display: flex; flex-direction: column; align-items: center;
    transition: background-color 0.8s ease;
  }
  .title-row { display: flex; align-items: center; gap: 10px; }
  .title-row .small-btn { font-size: 12px; padding: 3px 8px; }
  h1 { margin: 0; font-size: 18px; color: var(--title); transition: color 0.8s ease; }
  #status { font-size: 17px; font-weight: bold; margin: 2px 0; color: #d32f2f; line-height: 24px; min-height: 24px; text-align: center; }
  
  .hand-container {
    width: var(--board-size);
    background-color: #d7ba89; border: 2px solid #5c3a21; border-radius: 6px;
    padding: 3px 6px; margin: 4px 0; display: flex; align-items: center; min-height: 38px;
  }
  .hand-title { font-size: 13px; font-weight: bold; margin-right: 8px; color: #4a2c11; }
  .hand-pieces { display: flex; gap: 6px; flex-wrap: wrap; }
  .hand-piece {
    font-size: 18px; font-weight: bold; padding: 3px 7px;
    background: #fdf6e3; border: 1px solid #8b5a2b; border-radius: 4px; cursor: pointer;
  }
  .hand-piece.selected { background-color: #ffeb3b; }

  #board {
    display: grid;
    grid-template-columns: repeat(9, 1fr);
    grid-template-rows: repeat(9, 1fr);
    width: var(--board-size);
    height: var(--board-size);
    border: 3px solid var(--board-frame);
    background-color: var(--board-bg);
    box-shadow: var(--board-glow);
    transition: border-color 0.8s ease, background-color 0.8s ease, box-shadow 0.8s ease;
  }
  .cell {
    border: 1px solid #8b5a2b;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; font-weight: bold; cursor: pointer;
    min-width: 0; min-height: 0;
  }
  .cell.selected { background-color: #ffeb3b; }
  .cell.movable { background-color: #a5d6a7; }
  
  .ai-piece { color: #c62828; transform: rotate(180deg); }
  .player-piece { color: #111111; }
  .promoted { color: #b71c1c; }

  .btn {
    margin-top: 10px; padding: 12px 28px; font-size: 20px; font-weight: bold;
    background-color: #2e7d32; color: white; border: none; border-radius: 8px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.2);
  }

  #promote-modal {
    display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 100;
  }
  .modal-content { background: white; padding: 20px; border-radius: 12px; text-align: center; }
  .modal-btn { font-size: 20px; padding: 10px 20px; margin: 10px; font-weight: bold; border-radius: 8px; border: none; }

  #info-line { font-size: 14px; color: #4a2c11; margin: 0 0 2px; display: flex; gap: 14px; line-height: 20px; white-space: nowrap; }
  #info-line b { font-weight: bold; color: #111; }
  #info-line .ai-last { color: #c62828; }

  .cell.last-player { box-shadow: inset 0 0 0 3px rgba(17, 17, 17, 0.55); }
  .cell.last-ai { box-shadow: inset 0 0 0 3px rgba(198, 40, 40, 0.6); }

  .panel {
    width: var(--board-size); margin-top: 12px;
    background-color: #fdf6e3; border: 2px solid #5c3a21; border-radius: 6px; padding: 8px 12px;
  }
  .panel-title { font-size: 15px; font-weight: bold; color: #4a2c11; margin-bottom: 4px; display: flex; align-items: center; }
  .panel-title .spacer { flex: 1; }
  .small-btn {
    font-size: 13px; padding: 5px 10px; margin-left: 6px; border: 1px solid #8b5a2b; border-radius: 6px;
    background: #fff; color: #4a2c11; font-weight: bold;
  }
  .small-btn:disabled { opacity: 0.4; }
  #kifu-list { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; max-height: 112px; overflow-y: auto; font-size: 14px; color: #222; }
  #kifu-list li { width: 50%; padding: 2px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #kifu-list li .tag { margin-left: 4px; font-size: 11px; color: #8b5a2b; }
  #kifu-list li .n { display: inline-block; width: 2.2em; text-align: right; margin-right: 4px; color: #888; }
  #kifu-list li.ai { color: #c62828; }
  #kifu-list .empty { width: 100%; color: #888; padding: 4px 0; }
  #panel-msg { font-size: 13px; color: #2e7d32; min-height: 18px; margin-top: 4px; }

  .ranking {
    width: var(--board-size); margin-top: 16px;
    background-color: #fdf6e3; border: 2px solid #5c3a21; border-radius: 6px; padding: 8px 12px;
  }
  .ranking-title { font-size: 15px; font-weight: bold; color: #4a2c11; margin-bottom: 4px; }
  .rank-tabs { display: flex; gap: 4px; margin-bottom: 6px; border-bottom: 1px solid #e0d2b4; }
  .rank-tab {
    flex: 1; padding: 6px 4px; font: inherit; font-size: 14px; color: #8b5a2b; cursor: pointer;
    background: none; border: none; border-bottom: 3px solid transparent; margin-bottom: -1px;
  }
  .rank-tab.active { color: #4a2c11; font-weight: bold; border-bottom-color: #5c3a21; }
  #ranking { list-style: none; margin: 0; padding: 0; font-size: 15px; color: #222; }
  #ranking li { display: flex; gap: 8px; padding: 4px 0; border-top: 1px solid #e0d2b4; }
  #ranking li:first-child { border-top: none; }
  #ranking .rank { width: 2.5em; font-weight: bold; }
  #ranking .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #ranking .moves { width: 3.5em; text-align: right; }
  #ranking .date { color: #666; font-size: 13px; white-space: nowrap; }
  #ranking .empty { color: #888; padding: 4px 0; }

  #name-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 100; }
  #name-modal .modal-content { width: 88vw; max-width: 340px; }
  #opponent-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 100; }
  #opponent-modal .modal-content { width: 90vw; max-width: 360px; padding: 16px; }
  #opponent-modal h2 { margin: 0 0 4px; font-size: 18px; color: #4a2c11; }
  .opp-card {
    position: relative; display: block; width: 100%; margin: 8px 0; padding: 10px 36px 10px 12px;
    text-align: left; font: inherit; color: #4a2c11; cursor: pointer;
    background: #fdf6e3; border: 2px solid #e0d2b4; border-radius: 8px;
  }
  .opp-card.current { border-color: #5c3a21; }
  .opp-card.current::after { content: '✓'; position: absolute; top: 10px; right: 12px; font-size: 18px; font-weight: bold; color: #2e7d32; }
  .opp-name { font-family: "Yuji Syuku", "Hiragino Mincho ProN", serif; font-size: 26px; line-height: 1.2; color: #c62828; }
  .opp-style { margin-left: 8px; font-size: 13px; font-weight: bold; color: #8b5a2b; }
  .opp-intro { margin-top: 2px; font-size: 14px; line-height: 1.5; }
  #opponent-cancel { display: none; background: #9e9e9e; color: white; margin: 6px 0 0; }
  #name-input { width: 100%; font-size: 18px; padding: 8px; border: 1px solid #8b5a2b; border-radius: 6px; margin: 8px 0 4px; }

  /* 相手のセリフの吹き出し。相手の持ち駒の欄から下へ、盤の上端に重ねて出す */
  #ai-hand-box { position: relative; }
  #speech {
    position: absolute; left: 10px; top: calc(100% + 8px); z-index: 70; max-width: 82%;
    padding: 6px 12px 7px; border: 2px solid #5c3a21; border-radius: 10px;
    background: #fdf6e3; box-shadow: 0 3px 8px rgba(0,0,0,0.25);
    pointer-events: none; opacity: 0; transform: translateY(-4px) scale(0.96); transform-origin: 20px 0;
    transition: opacity 0.25s ease, transform 0.25s ease;
  }
  #speech::before {
    content: ''; position: absolute; top: -8px; left: 18px; width: 12px; height: 12px;
    background: #fdf6e3; border-left: 2px solid #5c3a21; border-top: 2px solid #5c3a21; transform: rotate(45deg);
  }
  #speech.show { opacity: 1; transform: none; }
  #speech .sp-name { display: block; font-size: 11px; font-weight: bold; color: #c62828; }
  #speech .sp-text { display: block; font-size: 14px; line-height: 1.45; color: #4a2c11; }
  body[data-fx="off"] #speech { transform: none; transition: opacity 0.15s; }
  @media (prefers-reduced-motion: reduce) { #speech { transform: none; transition: opacity 0.15s; } }

  /* 王手の筆文字表示 */
  #board-wrap { position: relative; width: var(--board-size); }
  #check-banner {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    pointer-events: none; opacity: 0; z-index: 50;
    font-family: "Yuji Syuku", "Hiragino Mincho ProN", serif;
    font-size: calc(var(--board-size) * 0.4); line-height: 1; color: #1b1b1b;
    letter-spacing: 0.04em;
    text-shadow: 0 0 18px rgba(244, 236, 225, 0.9), 0 0 2px rgba(0,0,0,0.4);
  }
  #check-banner.show { animation: brush-check 1.5s ease-out forwards; }
  @keyframes brush-check {
    0%   { opacity: 0; transform: scale(1.5) rotate(-6deg); filter: blur(8px); }
    18%  { opacity: 1; transform: scale(1.0) rotate(-3deg); filter: blur(0); }
    70%  { opacity: 1; transform: scale(1.0) rotate(-3deg); filter: blur(0); }
    100% { opacity: 0; transform: scale(1.06) rotate(-3deg); filter: blur(3px); }
  }
  @media (prefers-reduced-motion: reduce) {
    @keyframes brush-check {
      0%, 15% { opacity: 0; } 25%, 75% { opacity: 1; } 100% { opacity: 0; }
    }
  }

  /* 戦法・囲いが成立したときの表示。墨の帯が走り、名前が浮かび、狙いの説明が続く */
  #strategy-banner {
    position: absolute; inset: 0; z-index: 49;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    pointer-events: none; opacity: 0;
  }
  #strategy-banner .st-band {
    position: relative; width: 100%; padding: 6px 0 8px;
    display: flex; flex-direction: column; align-items: center;
  }
  #strategy-banner .st-band::before {
    content: ''; position: absolute; inset: 0; z-index: -1;
    background: rgba(24, 16, 10, 0.78);
    -webkit-mask-image: linear-gradient(90deg, transparent, #000 12%, #000 88%, transparent);
    mask-image: linear-gradient(90deg, transparent, #000 12%, #000 88%, transparent);
    transform-origin: left center;
  }
  #strategy-banner .st-label { font-size: 12px; font-weight: bold; color: #d4af37; letter-spacing: 0.2em; }
  #strategy-banner .st-name {
    font-family: "Yuji Syuku", "Hiragino Mincho ProN", serif;
    line-height: 1.15; color: #fdf6e3; white-space: nowrap; letter-spacing: 0.06em;
    text-shadow: 0 0 14px rgba(212, 175, 55, 0.75);
  }
  #strategy-banner.ai .st-label { color: #ef9a9a; }
  #strategy-banner.ai .st-name { text-shadow: 0 0 14px rgba(229, 57, 53, 0.7); }
  /* 盤の上には名前だけを短く出す。狙いの説明は盤の外の「戦法メモ」に残す */
  #strategy-banner.show { animation: st-in 0.2s ease-out forwards; }
  #strategy-banner.show .st-band::before { animation: st-sweep 0.4s ease-out both; }
  #strategy-banner.show .st-name { animation: st-ink 0.6s ease-out 0.15s both; }
  #strategy-banner.show.out { animation: st-out 0.25s ease-in forwards; }
  @keyframes st-in { from { opacity: 0; } to { opacity: 1; } }
  @keyframes st-sweep { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @keyframes st-ink {
    from { opacity: 0; transform: scale(1.25); filter: blur(8px); }
    to   { opacity: 1; transform: scale(1); filter: blur(0); }
  }
  @keyframes st-out { from { opacity: 1; } to { opacity: 0; } }
  /* 演出オフや動きを減らす設定では、動かさずに名前だけを出して消す */
  body[data-fx="off"] #strategy-banner.show .st-band::before,
  body[data-fx="off"] #strategy-banner.show .st-name { animation: none; }
  @media (prefers-reduced-motion: reduce) {
    #strategy-banner.show .st-band::before, #strategy-banner.show .st-name { animation: none; }
  }

  /* 戦法メモ。この対局でできた戦法と狙いを盤の外に残す */
  #strategy-note {
    width: var(--board-size); margin: 0 0 4px; padding: 6px 10px;
    background: #fdf6e3; border: 2px solid #5c3a21; border-radius: 6px; color: #4a2c11;
  }
  #strategy-note .note-empty { font-size: 13px; color: #888; }
  #strategy-note .note-head { display: flex; align-items: baseline; gap: 8px; }
  #strategy-note .note-label { font-size: 12px; font-weight: bold; color: #8b5a2b; }
  #strategy-note .note-current.ai .note-label { color: #c62828; }
  #strategy-note .note-name { font-family: "Yuji Syuku", "Hiragino Mincho ProN", serif; font-size: 20px; line-height: 1.3; }
  #strategy-note .note-aim { font-size: 13px; line-height: 1.55; }
  #strategy-note .note-chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  #strategy-note .note-chips:empty { display: none; }
  .note-chip {
    font: inherit; font-size: 12px; padding: 2px 8px; cursor: pointer;
    background: #fff; color: #4a2c11; border: 1px solid #e0d2b4; border-radius: 12px;
  }
  .note-chip.ai { color: #c62828; }
  .note-chip.active { border-color: #5c3a21; font-weight: bold; }

  /* ---- 形勢に応じた雰囲気（盤の外側だけを変え、マスと駒には触れない） ---- */
  /* 優勢: 朝 */
  body:not([data-fx="off"])[data-mood="good"] {
    --bg: #faf6ee; --board-bg: #e9bd7c; --board-frame: #6b4a2a;
    --board-glow: 0 4px 8px rgba(0,0,0,0.2), 0 0 26px rgba(212,175,55,0.5);
  }
  /* 劣勢: 曇り */
  body:not([data-fx="off"])[data-mood="bad"] {
    --bg: #d9dde3; --board-bg: #d4a468; --board-frame: #3f2d20;
    --board-glow: 0 4px 10px rgba(0,0,0,0.35);
  }
  /* 危険: 夕暮れ。盤の縁がゆっくり赤く脈打つ */
  body:not([data-fx="off"])[data-mood="danger"] {
    --bg: #3a2323; --board-bg: #cf9c5f; --board-frame: #2a1a14; --title: #f4ece1;
  }
  body:not([data-fx="off"])[data-mood="danger"] #board { animation: heartbeat 2s ease-in-out infinite; }
  @keyframes heartbeat {
    0%, 100% { box-shadow: 0 4px 10px rgba(0,0,0,0.4), 0 0 0 0 rgba(229,57,53,0); }
    50%      { box-shadow: 0 4px 10px rgba(0,0,0,0.4), 0 0 30px 8px rgba(229,57,53,0.75); }
  }
  /* 絶体絶命: サイケデリック。背景と盤の縁と王手の文字だけ */
  body:not([data-fx="off"])[data-mood="doom"] {
    --bg: #120a1e; --board-bg: #cf9c5f; --board-frame: #1a1026; --title: #ffffff;
  }
  body:not([data-fx="off"])[data-mood="doom"]::before {
    content: ''; position: fixed; inset: 0; z-index: -1;
    background: linear-gradient(135deg, #ff004c, #ff8a00, #ffe600, #00e676, #00b0ff, #7c4dff, #ff004c);
    background-size: 400% 400%;
    animation: psy-shift 6s linear infinite, psy-hue 6s linear infinite;
  }
  @keyframes psy-shift { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
  @keyframes psy-hue { to { filter: hue-rotate(360deg); } }
  body:not([data-fx="off"])[data-mood="doom"] #board { animation: psy-frame 3s linear infinite; }
  @keyframes psy-frame {
    0%   { box-shadow: 0 0 26px 8px #ff004c; }
    25%  { box-shadow: 0 0 26px 8px #ffe600; }
    50%  { box-shadow: 0 0 26px 8px #00e676; }
    75%  { box-shadow: 0 0 26px 8px #00b0ff; }
    100% { box-shadow: 0 0 26px 8px #ff004c; }
  }
  body:not([data-fx="off"])[data-mood="doom"] #check-banner {
    color: transparent; text-shadow: none;
    background: linear-gradient(90deg, #ff004c, #ffe600, #00e676, #00b0ff, #7c4dff);
    -webkit-background-clip: text; background-clip: text;
  }
  /* 勝ち: 金の紙吹雪 */
  body:not([data-fx="off"])[data-mood="win"] {
    --bg: #fbf3dc; --board-glow: 0 4px 8px rgba(0,0,0,0.2), 0 0 32px rgba(212,175,55,0.65);
  }
  /* 負け: 墨が広がって灰色に沈む */
  body:not([data-fx="off"])[data-mood="lose"] {
    --bg: #6b6b6b; --board-bg: #b9a389; --board-frame: #333333; --title: #f4ece1;
  }
  #fx-layer { position: fixed; inset: 0; pointer-events: none; z-index: 60; overflow: hidden; }
  #fx-layer .ink {
    position: absolute; inset: 0; opacity: 0; transition: opacity 2s ease;
    background: radial-gradient(circle at 50% 40%, rgba(20,20,20,0.5) 0%, rgba(20,20,20,0.3) 60%, rgba(20,20,20,0.1) 100%);
  }
  body:not([data-fx="off"])[data-mood="lose"] #fx-layer .ink { opacity: 1; }
  .confetti {
    position: absolute; top: -16px; width: 10px; height: 14px; opacity: 0.9; border-radius: 2px;
    animation: fall linear forwards;
  }
  @keyframes fall {
    0%   { transform: translateY(0) rotate(0deg); }
    100% { transform: translateY(110vh) rotate(720deg); }
  }
  /* 暗い背景のときは文字の後ろに紙色の帯を敷いて読めるようにする */
  body:not([data-fx="off"]):is([data-mood="danger"], [data-mood="doom"], [data-mood="lose"]) :is(#status, #info-line) {
    background: rgba(253,246,227,0.92); padding: 0 12px; border-radius: 6px;
  }
  @media (prefers-reduced-motion: reduce) {
    body[data-mood] #board, body[data-mood]::before { animation: none !important; }
    .confetti { display: none; }
  }
</style>
</head>
<body>

<div class="title-row">
  <h1>らくらく将棋</h1>
  <button id="fx-toggle" class="small-btn" onclick="toggleFx()">演出 オン</button>
</div>
<div id="status">あなたの番です</div>
<div id="info-line"><span id="move-count">0手</span><span>あなた <b id="last-player">なし</b></span><span><span id="ai-label">相手</span> <b id="last-ai" class="ai-last">なし</b></span></div>

<div class="hand-container" id="ai-hand-box">
  <div class="hand-title" id="ai-hand-title">相手の持ち駒:</div>
  <div id="ai-hand" class="hand-pieces"></div>
  <div id="speech" aria-live="polite"><span class="sp-name"></span><span class="sp-text"></span></div>
</div>

<div id="board-wrap">
  <div id="board"></div>
  <div id="check-banner" aria-live="polite">王手</div>
  <div id="strategy-banner" aria-live="polite">
    <div class="st-band"><div class="st-label"></div><div class="st-name"></div></div>
  </div>
</div>

<div class="hand-container">
  <div class="hand-title">あなたの持ち駒:</div>
  <div id="player-hand" class="hand-pieces"></div>
</div>

<div id="strategy-note" aria-live="polite"></div>

<button class="btn" onclick="openOpponentModal(true)">新しい対局</button>

<div class="panel">
  <div class="panel-title">棋譜<span class="spacer"></span>
    <button class="small-btn" id="copy-btn" onclick="copyKifu()">コピー</button>
    <button class="small-btn" id="download-btn" onclick="downloadKifu()">ダウンロード</button>
  </div>
  <ol id="kifu-list"></ol>
  <div id="panel-msg"></div>
</div>

<div class="ranking">
  <div class="ranking-title" id="ranking-title">ランキング</div>
  <div class="rank-tabs" id="rank-tabs" role="tablist"></div>
  <ol id="ranking"></ol>
</div>

<div id="opponent-modal">
  <div class="modal-content">
    <h2>対戦相手を選ぶ</h2>
    <div id="opponent-list"></div>
    <button class="modal-btn" id="opponent-cancel" onclick="closeOpponentModal()">やめる</button>
  </div>
</div>

<div id="name-modal">
  <div class="modal-content">
    <p id="name-modal-msg" style="font-size: 20px; font-weight: bold; margin: 0;"></p>
    <p style="margin: 8px 0 0; font-size: 15px;">ランキングに登録する名前</p>
    <input id="name-input" type="text" maxlength="12" placeholder="名前" autocomplete="off">
    <div>
      <button class="modal-btn" style="background:#4caf50; color:white;" onclick="handleNameSubmit(true)">登録</button>
      <button class="modal-btn" style="background:#9e9e9e; color:white;" onclick="handleNameSubmit(false)">登録しない</button>
    </div>

</div>

<div id="fx-layer"><div class="ink"></div></div>

<div id="promote-modal">
  <div class="modal-content">
    <p style="font-size: 22px; font-weight: bold;">成りますか？</p>
    <button class="modal-btn" style="background:#4caf50; color:white;" onclick="handlePromoteChoice(true)">成る</button>
    <button class="modal-btn" style="background:#9e9e9e; color:white;" onclick="handlePromoteChoice(false)">成らない</button>
  </div>
</div>

<script>
const KINDS = {
  FU: "歩", KY: "香", KE: "桂", GI: "銀", KI: "金", KA: "角", HI: "飛", OU: "王",
  TO: "と", NY: "成香", NK: "成桂", NG: "成銀", UM: "馬", RY: "竜"
};

const PIECE_VALUES = {
  FU: 100, KY: 300, KE: 450, GI: 600, KI: 700, KA: 900, HI: 1000, OU: 30000,
  TO: 700, NY: 700, NK: 700, NG: 700, UM: 1300, RY: 1500
};

let board = [];
let hands = { player: [], ai: [] };
let turn = "player";
let selected = null;
let movable = [];
let pendingMove = null;
let moveCount = 0;
let kifu = [];                          // 今の対局の指し手
let lastMoves = { player: null, ai: null }; // 双方の最後の一手（盤上の印と表示に使う）
let gameStartedAt = 0;
let announced = { player: new Set(), ai: new Set(), both: new Set() }; // この対局で表示済みの戦法
let opponent = null;                    // 選んだ対戦相手（OPPONENTS の1人）
let lastAction = { side: null, captured: null, promoted: false }; // 直前の手で取った駒と成ったか（セリフに使う）
let planDone = new Set();               // 相手の序盤の手順のうち、達成した項目の番号

function resetGame() {
  turn = "player";
  selected = null;
  movable = [];
  hands = { player: [], ai: [] };
  moveCount = 0;
  updateMoveCount();
  kifu = [];
  lastMoves = { player: null, ai: null };
  gameStartedAt = Date.now();
  announced = { player: new Set(), ai: new Set(), both: new Set() };
  planDone = new Set();
  clearStrategyBanner();
  clearSpeech();
  setMood('even');
  renderKifu();
  renderLastMoves();

  board = [
    [ {k:'KY',o:'ai'}, {k:'KE',o:'ai'}, {k:'GI',o:'ai'}, {k:'KI',o:'ai'}, {k:'OU',o:'ai'}, {k:'KI',o:'ai'}, {k:'GI',o:'ai'}, {k:'KE',o:'ai'}, {k:'KY',o:'ai'} ],
    [ null, {k:'HI',o:'ai'}, null, null, null, null, null, {k:'KA',o:'ai'}, null ],
    [ {k:'FU',o:'ai'}, {k:'FU',o:'ai'}, {k:'FU',o:'ai'}, {k:'FU',o:'ai'}, {k:'FU',o:'ai'}, {k:'FU',o:'ai'}, {k:'FU',o:'ai'}, {k:'FU',o:'ai'}, {k:'FU',o:'ai'} ],
    [ null, null, null, null, null, null, null, null, null ],
    [ null, null, null, null, null, null, null, null, null ],
    [ null, null, null, null, null, null, null, null, null ],
    [ {k:'FU',o:'player'}, {k:'FU',o:'player'}, {k:'FU',o:'player'}, {k:'FU',o:'player'}, {k:'FU',o:'player'}, {k:'FU',o:'player'}, {k:'FU',o:'player'}, {k:'FU',o:'player'}, {k:'FU',o:'player'} ],
    [ null, {k:'KA',o:'player'}, null, null, null, null, null, {k:'HI',o:'player'}, null ],
    [ {k:'KY',o:'player'}, {k:'KE',o:'player'}, {k:'GI',o:'player'}, {k:'KI',o:'player'}, {k:'OU',o:'player'}, {k:'KI',o:'player'}, {k:'GI',o:'player'}, {k:'KE',o:'player'}, {k:'KY',o:'player'} ]
  ];
  tagHomes();

  document.getElementById('status').textContent = 'あなたの番です';
  document.getElementById('status').style.color = '#d32f2f';
  render();
}

function getMoves(r, c, b = board) {
  const p = b[r][c];
  if (!p) return [];
  const moves = [];
  const dir = p.o === 'player' ? -1 : 1;

  const addMove = (tr, tc) => {
    if (tr < 0 || tr > 8 || tc < 0 || tc > 8) return false;
    const target = b[tr][tc];
    if (!target) { moves.push({r: tr, c: tc}); return true; }
    if (target.o !== p.o) { moves.push({r: tr, c: tc}); }
    return false;
  };

  const addRay = (dr, dc) => {
    let tr = r + dr, tc = c + dc;
    while (addMove(tr, tc)) { tr += dr; tc += dc; }
  };

  const k = p.k;
  const isGold = ['KI','TO','NY','NK','NG'].includes(k);

  if (k === 'FU') { addMove(r + dir, c); }
  else if (k === 'KY') { addRay(dir, 0); }
  else if (k === 'KE') { addMove(r + dir * 2, c - 1); addMove(r + dir * 2, c + 1); }
  else if (k === 'GI') {
    [dir, -dir].forEach(dr => [-1,0,1].forEach(dc => {
      if (dr === dir || (dr === -dir && dc !== 0)) addMove(r + dr, c + dc);
    }));
  }
  else if (isGold) {
    [-1, 0, 1].forEach(dr => [-1, 0, 1].forEach(dc => {
      if (dr === 0 && dc === 0) return;
      if (dr === -dir && dc !== 0) return;
      addMove(r + dr, c + dc);
    }));
  }
  else if (k === 'OU') {
    [-1,0,1].forEach(dr => [-1,0,1].forEach(dc => { if(dr!==0||dc!==0) addMove(r+dr, c+dc); }));
  }
  else if (k === 'HI') { addRay(1,0); addRay(-1,0); addRay(0,1); addRay(0,-1); }
  else if (k === 'RY') {
    addRay(1,0); addRay(-1,0); addRay(0,1); addRay(0,-1);
    [-1,1].forEach(dr => [-1,1].forEach(dc => addMove(r+dr, c+dc)));
  }
  else if (k === 'KA') { addRay(1,1); addRay(1,-1); addRay(-1,1); addRay(-1,-1); }
  else if (k === 'UM') {
    addRay(1,1); addRay(1,-1); addRay(-1,1); addRay(-1,-1);
    [-1,1].forEach(dr => addMove(r+dr, c)); [-1,1].forEach(dc => addMove(r, c+dc));
  }

  return moves;
}

function getDropMoves(owner, kind, b = board) {
  const drops = [];
  const pawnColumns = new Set();
  if (kind === 'FU') {
    for (let c = 0; c < 9; c++) {
      for (let r = 0; r < 9; r++) {
        const p = b[r][c];
        if (p && p.o === owner && p.k === 'FU') {
          pawnColumns.add(c);
          break;
        }
      }
    }
  }

  for (let r = 0; r < 9; r++) {
    for (let c = 0; c < 9; c++) {
      if (!b[r][c]) {
        if (kind === 'FU' && pawnColumns.has(c)) continue;
        drops.push({r, c});
      }
    }
  }
  return drops;
}

function getAllPseudoLegalMoves(owner, b = board, h = hands) {
  const moves = [];
  for (let r = 0; r < 9; r++) {
    for (let c = 0; c < 9; c++) {
      if (b[r][c] && b[r][c].o === owner) {
        const ms = getMoves(r, c, b);
        ms.forEach(m => moves.push({ type: 'move', fr: r, fc: c, tr: m.r, tc: m.c }));
      }
    }
  }
  if (h[owner].length > 0) {
    const uniqueKinds = [...new Set(h[owner])];
    uniqueKinds.forEach(kind => {
      const drops = getDropMoves(owner, kind, b);
      drops.forEach(d => moves.push({ type: 'drop', kind: kind, tr: d.r, tc: d.c }));
    });
  }
  return moves;
}

function isInCheck(owner, b = board) {
  let kingPos = null;
  for (let r = 0; r < 9; r++) {
    for (let c = 0; c < 9; c++) {
      if (b[r][c] && b[r][c].k === 'OU' && b[r][c].o === owner) {
        kingPos = { r, c };
        break;
      }
    }
  }
  if (!kingPos) return false;

  const opponent = owner === 'player' ? 'ai' : 'player';
  for (let r = 0; r < 9; r++) {
    for (let c = 0; c < 9; c++) {
      if (b[r][c] && b[r][c].o === opponent) {
        const ms = getMoves(r, c, b);
        if (ms.some(m => m.r === kingPos.r && m.c === kingPos.c)) {
          return true;
        }
      }
    }
  }
  return false;
}

function getAllStrictLegalMoves(owner, b = board, h = hands) {
  const pseudoMoves = getAllPseudoLegalMoves(owner, b, h);
  const legalMoves = [];

  pseudoMoves.forEach(m => {
    const tempBoard = JSON.parse(JSON.stringify(b));
    if (m.type === 'move') {
      const movingPiece = tempBoard[m.fr][m.fc];
      const canPromote = (owner === 'ai' ? m.tr >= 6 || m.fr >= 6 : m.tr <= 2 || m.fr <= 2) && ['FU','KY','KE','GI','KA','HI'].includes(movingPiece.k);
      if (canPromote && owner === 'ai') {
        const promMap = { FU:'TO', KY:'NY', KE:'NK', GI:'NG', KA:'UM', HI:'RY' };
        movingPiece.k = promMap[movingPiece.k] || movingPiece.k;
      }
      tempBoard[m.tr][m.tc] = movingPiece;
      tempBoard[m.fr][m.fc] = null;
    } else {
      tempBoard[m.tr][m.tc] = { k: m.kind, o: owner };
    }

    if (!isInCheck(owner, tempBoard)) {
      legalMoves.push(m);
    }
  });

  return legalMoves;
}

function handleCellClick(r, c) {
  if (turn !== 'player') return;

  if (selected && selected.handIndex !== undefined) {
    if (movable.some(m => m.r === r && m.c === c)) {
      const dropKind = hands.player[selected.handIndex];
      
      const tempBoard = JSON.parse(JSON.stringify(board));
      tempBoard[r][c] = { k: dropKind, o: 'player' };
      if (isInCheck('player', tempBoard)) {
        alert('王手がかかっています！王手を解除してください。');
        return;
      }

      hands.player.splice(selected.handIndex, 1);
      board[r][c] = { k: dropKind, o: 'player' };
      recordMove('player', dropKind, null, null, r, c, false, true);
      finishPlayerTurn();
    } else {
      selected = null; movable = []; render();
    }
    return;
  }

  const p = board[r][c];
  if (p && p.o === 'player') {
    selected = { r, c };
    movable = getMoves(r, c);
    render();
    return;
  }

  if (selected && movable.some(m => m.r === r && m.c === c)) {
    const fromP = board[selected.r][selected.c];
    const canPromote = (r <= 2 || selected.r <= 2) && ['FU','KY','KE','GI','KA','HI'].includes(fromP.k);

    if (canPromote) {
      pendingMove = { fromR: selected.r, fromC: selected.c, toR: r, toC: c };
      document.getElementById('promote-modal').style.display = 'flex';
    } else {
      const tempBoard = JSON.parse(JSON.stringify(board));
      tempBoard[r][c] = tempBoard[selected.r][selected.c];
      tempBoard[selected.r][selected.c] = null;
      if (isInCheck('player', tempBoard)) {
        alert('王手がかかっています！王手を解除してください。');
        return;
      }

      executeMove(selected.r, selected.c, r, c, false);
      finishPlayerTurn();
    }
  } else {
    selected = null; movable = []; render();
  }
}

function handlePromoteChoice(promote) {
  document.getElementById('promote-modal').style.display = 'none';
  if (pendingMove) {
    const tempBoard = JSON.parse(JSON.stringify(board));
    const p = tempBoard[pendingMove.fromR][pendingMove.fromC];
    if (promote) {
      const promMap = { FU:'TO', KY:'NY', KE:'NK', GI:'NG', KA:'UM', HI:'RY' };
      p.k = promMap[p.k] || p.k;
    }
    tempBoard[pendingMove.toR][pendingMove.toC] = p;
    tempBoard[pendingMove.fromR][pendingMove.fromC] = null;

    if (isInCheck('player', tempBoard)) {
      alert('王手がかかっています！王手を解除してください。');
      pendingMove = null;
      return;
    }

    executeMove(pendingMove.fromR, pendingMove.fromC, pendingMove.toR, pendingMove.toC, promote);
    pendingMove = null;
    finishPlayerTurn();
  }
}

function executeMove(fr, fc, tr, tc, promote) {
  const target = board[tr][tc];
  let captured = null;

  if (target) {
    let rawKind = target.k;
    const unpromote = { TO:'FU', NY:'KY', NK:'KE', NG:'GI', UM:'KA', RY:'HI' };
    if (unpromote[rawKind]) rawKind = unpromote[rawKind];
    hands[turn].push(rawKind);
    captured = rawKind;
  }

  const p = board[fr][fc];
  recordMove(turn, p.k, fr, fc, tr, tc, promote, false);
  lastAction.captured = captured;
  if (promote) {
    const promMap = { FU:'TO', KY:'NY', KE:'NK', GI:'NG', KA:'UM', HI:'RY' };
    p.k = promMap[p.k] || p.k;
  }
  board[tr][tc] = p;
  board[fr][fc] = null;
}

function selectHand(index) {
  if (turn !== 'player') return;
  const kind = hands.player[index];
  selected = { handIndex: index };
  movable = getDropMoves('player', kind);
  render();
}

function finishPlayerTurn() {
  selected = null; movable = []; render();

  if (!isKingOnBoard('ai')) {
    endGame('あなたの勝ちです！ 🎉', true);
    return;
  }

  const aiMoves = getAllStrictLegalMoves('ai');
  if (aiMoves.length === 0) {
    endGame('詰みました！あなたの勝ちです！ 🎉', true);
    return;
  }

  turn = 'ai';
  document.getElementById('status').textContent = opponent.name + 'が考えています...';
  const gaveCheck = isInCheck('ai');
  if (gaveCheck) showCheck();
  const found = announceStrategies(gaveCheck ? 1500 : 0);
  speakAfterMove('player', found, gaveCheck);
  setTimeout(aiTurn, gaveCheck ? 1300 : 200);
}

function isKingOnBoard(owner) {
  for (let r = 0; r < 9; r++) {
    for (let c = 0; c < 9; c++) {
      if (board[r][c] && board[r][c].k === 'OU' && board[r][c].o === owner) return true;
    }
  }
  return false;
}

function endGame(message, playerWon = false) {
  turn = 'gameover';
  const statusEl = document.getElementById('status');
  statusEl.textContent = message;
  statusEl.style.color = '#2e7d32';
  selected = null;
  movable = [];
  render();
  setMood(playerWon ? 'win' : 'lose');
  say(playerWon ? 'aiLose' : 'aiWin');
  if (playerWon) openNameModal();
}

// ---- 棋譜 ----
const FILE_CHARS = ['１','２','３','４','５','６','７','８','９'];
const RANK_CHARS = ['一','二','三','四','五','六','七','八','九'];
const KIF_NAMES = { FU:'歩', KY:'香', KE:'桂', GI:'銀', KI:'金', KA:'角', HI:'飛', OU:'玉',
                    TO:'と', NY:'成香', NK:'成桂', NG:'成銀', UM:'馬', RY:'龍' };

// 盤の配列位置を将棋の表記（７六 など）に直す
function squareText(r, c) { return FILE_CHARS[8 - c] + RANK_CHARS[r]; }
function squareKif(r, c) { return String(9 - c) + String(r + 1); }

function recordMove(side, kind, fr, fc, tr, tc, promote, isDrop) {
  const prev = kifu[kifu.length - 1];
  const same = prev && prev.tr === tr && prev.tc === tc;
  const mark = side === 'player' ? '▲' : '△';
  const name = KIF_NAMES[kind] + (promote ? '成' : '');
  const sq = same ? '同　' : squareText(tr, tc);
  const text = mark + sq + name + (isDrop ? '打' : '');
  const origin = isDrop ? '打' : '(' + squareKif(fr, fc) + ')';
  const kif = sq + name + origin;
  kifu.push({ n: kifu.length + 1, side, text, kif, tr, tc });
  lastAction = { side, captured: null, promoted: !!promote };
  moveCount = kifu.length;
  updateMoveCount();

  lastMoves[side] = { r: tr, c: tc };
  const other = side === 'player' ? 'ai' : 'player';
  if (lastMoves[other] && lastMoves[other].r === tr && lastMoves[other].c === tc) lastMoves[other] = null;

  renderKifu();
  renderLastMoves();
}

function renderLastMoves() {
  const last = side => { for (let i = kifu.length - 1; i >= 0; i--) if (kifu[i].side === side) return kifu[i].text; return 'なし'; };
  document.getElementById('last-player').textContent = last('player');
  document.getElementById('last-ai').textContent = last('ai');
}

function renderKifu() {
  const el = document.getElementById('kifu-list');
  el.innerHTML = '';
  if (kifu.length === 0) {
    const li = document.createElement('li');
    li.className = 'empty';
    li.textContent = 'まだ指していません。';
    el.appendChild(li);
  } else {
    kifu.forEach(m => {
      const li = document.createElement('li');
      li.className = m.side;
      const n = document.createElement('span'); n.className = 'n'; n.textContent = m.n;
      li.appendChild(n);
      li.appendChild(document.createTextNode(m.text));
      if (m.tags) {
        const tag = document.createElement('span'); tag.className = 'tag'; tag.textContent = m.tags.join('・');
        li.appendChild(tag);
      }
      el.appendChild(li);
    });
    el.scrollTop = el.scrollHeight;
  }
  document.getElementById('copy-btn').disabled = kifu.length === 0;
  document.getElementById('download-btn').disabled = kifu.length === 0;
}

function pad2(n) { return String(n).padStart(2, '0'); }
function formatDateTime(ts) {
  const d = new Date(ts);
  return d.getFullYear() + '/' + pad2(d.getMonth() + 1) + '/' + pad2(d.getDate()) + ' ' +
         pad2(d.getHours()) + ':' + pad2(d.getMinutes()) + ':' + pad2(d.getSeconds());
}

// KIF形式（他の将棋アプリで読める棋譜ファイルの形式）の文字列を組み立てる
function buildKif(game) {
  let name = 'あなた';
  try { name = localStorage.getItem(LAST_NAME_KEY) || name; } catch (e) {}
  const lines = [
    '# KIF形式棋譜ファイル',
    '開始日時：' + formatDateTime(game.startedAt),
    '終了日時：' + formatDateTime(game.endedAt),
    '手合割：平手',
    '先手：' + name,
    '後手：' + (game.opponent || 'らくらく将棋AI'),
    '手数----指手---------消費時間--'
  ];
  game.moves.forEach((m, i) => lines.push(String(i + 1).padStart(4, ' ') + ' ' + m.kif + '   ( 0:00/00:00:00)'));
  const n = game.moves.length;
  if (game.result === 'win') {
    lines.push(String(n + 1).padStart(4, ' ') + ' 詰み');
    lines.push('まで' + n + '手で先手の勝ち');
  } else if (game.result === 'lose') {
    lines.push(String(n + 1).padStart(4, ' ') + ' 投了');
    lines.push('まで' + n + '手で後手の勝ち');
  } else {
    lines.push(String(n + 1).padStart(4, ' ') + ' 中断');
  }
  return lines.join('\n') + '\n';
}

function currentGame(result) {
  return { startedAt: gameStartedAt, endedAt: Date.now(), result, moves: kifu.map(m => ({ kif: m.kif, text: m.text })), opponent: opponent.name };
}

function showPanelMessage(text) {
  const el = document.getElementById('panel-msg');
  el.textContent = text;
  clearTimeout(showPanelMessage.timer);
  showPanelMessage.timer = setTimeout(() => { el.textContent = ''; }, 2500);
}

function copyText(text) {
  const done = () => showPanelMessage('棋譜をコピーしました。将棋アプリに貼り付けられます。');
  const fail = () => showPanelMessage('コピーできませんでした。ダウンロードをお使いください。');
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done, fail);
  } else {
    fail();
  }
}

function downloadText(text, ts) {
  const d = new Date(ts);
  const fname = 'rakushogi_' + d.getFullYear() + pad2(d.getMonth() + 1) + pad2(d.getDate()) + '_' + pad2(d.getHours()) + pad2(d.getMinutes()) + '.kif';
  const blob = new Blob(['\uFEFF' + text], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = fname;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  showPanelMessage(fname + ' を保存しました。');
}

function currentResult() {
  if (turn !== 'gameover') return 'none';
  return isKingOnBoard('ai') && getAllStrictLegalMoves('ai').length > 0 ? 'lose' : 'win';
}
function copyKifu() { copyText(buildKif(currentGame(currentResult()))); }
function downloadKifu() { downloadText(buildKif(currentGame(currentResult())), Date.now()); }

// ---- 手数とランキング ----
const RANKING_API = 'https://rakuraku-shogi.typersize.workers.dev/ranking';
const LAST_NAME_KEY = 'rakushogi-last-name';

function updateMoveCount() {
  document.getElementById('move-count').textContent = moveCount + '手';
}

// ランキングはみんなで共有するため、Cloudflare Workers 上のAPIに読み書きする。相手ごとに別のランキング
let rankingOpponent = null; // ランキング欄で開いている相手
let winOpponent = null;     // 勝ったときの相手（名前の登録が終わるまで覚えておく）

function showRankingTab(o) {
  rankingOpponent = o;
  document.getElementById('ranking-title').textContent = o.name + 'に少ない手数で勝った順';
  const tabs = document.getElementById('rank-tabs');
  tabs.innerHTML = '';
  OPPONENTS.forEach(x => {
    const b = document.createElement('button');
    b.className = 'rank-tab' + (x.id === o.id ? ' active' : '');
    b.setAttribute('role', 'tab');
    b.setAttribute('aria-selected', x.id === o.id);
    b.textContent = x.name;
    b.onclick = () => loadRanking(x);
    tabs.appendChild(b);
  });
}

async function loadRanking(o) {
  showRankingTab(o);
  renderRankingMessage('読み込み中...');
  try {
    const res = await fetch(RANKING_API + '?opponent=' + o.id, { cache: 'no-store' });
    if (!res.ok) throw new Error(res.status);
    const data = await res.json();

  const d = new Date(ts);
  const z = n => String(n).padStart(2, '0');
  return d.getFullYear() + '/' + z(d.getMonth() + 1) + '/' + z(d.getDate()) + ' ' + z(d.getHours()) + ':' + z(d.getMinutes());
}

// 静的盤面評価関数（AI視点：プラスならAI優勢）
function evaluateBoard(b, h) {
  let score = 0;

  // 1. 盤上の駒の評価＋位置加点
  for (let r = 0; r < 9; r++) {
    for (let c = 0; c < 9; c++) {
      const p = b[r][c];
      if (p) {
        let val = PIECE_VALUES[p.k];
        // 敵陣深くへの侵入評価
        let posBonus = (p.o === 'ai') ? (r * 15) : ((8 - r) * 15);
        
        if (p.o === 'ai') score += (val + posBonus);
        else score -= (val + posBonus);
      }
    }
  }

  // 2. 持ち駒の評価
  h.ai.forEach(k => score += PIECE_VALUES[k] * 1.1);
  h.player.forEach(k => score -= PIECE_VALUES[k] * 1.1);

  return score;
}

// Minimax（アルファベータ枝刈り）探索関数（深さ3手）
function minimax(b, h, depth, alpha, beta, isMaximizing) {
  if (depth === 0) return evaluateBoard(b, h);

  const owner = isMaximizing ? 'ai' : 'player';
  const moves = getAllStrictLegalMoves(owner, b, h);

  if (moves.length === 0) {
    return isMaximizing ? -99999 : 99999; // 詰み状態
  }

  if (isMaximizing) {
    let maxEval = -Infinity;
    for (const m of moves) {
      const { tempB, tempH } = applyMove(b, h, m, owner);
      const evalVal = minimax(tempB, tempH, depth - 1, alpha, beta, false);
      maxEval = Math.max(maxEval, evalVal);
      alpha = Math.max(alpha, evalVal);
      if (beta <= alpha) break; // 枝刈り
    }
    return maxEval;
  } else {
    let minEval = Infinity;
    for (const m of moves) {
      const { tempB, tempH } = applyMove(b, h, m, owner);
      const evalVal = minimax(tempB, tempH, depth - 1, alpha, beta, true);
      minEval = Math.min(minEval, evalVal);
      beta = Math.min(beta, evalVal);
      if (beta <= alpha) break; // 枝刈り
    }
    return minEval;
  }
}

function applyMove(b, h, m, owner) {
  const tempB = JSON.parse(JSON.stringify(b));
  const tempH = JSON.parse(JSON.stringify(h));

  if (m.type === 'move') {
    const target = tempB[m.tr][m.tc];
    if (target) {
      let rawKind = target.k;
      const unprom = { TO:'FU', NY:'KY', NK:'KE', NG:'GI', UM:'KA', RY:'HI' };
      if (unprom[rawKind]) rawKind = unprom[rawKind];
      tempH[owner].push(rawKind);
    }
    const p = tempB[m.fr][m.fc];
    const canPromote = (owner === 'ai' ? m.tr >= 6 || m.fr >= 6 : m.tr <= 2 || m.fr <= 2) && ['FU','KY','KE','GI','KA','HI'].includes(p.k);
    if (canPromote) {
      const promMap = { FU:'TO', KY:'NY', KE:'NK', GI:'NG', KA:'UM', HI:'RY' };
      p.k = promMap[p.k] || p.k;
    }
    tempB[m.tr][m.tc] = p;
    tempB[m.fr][m.fc] = null;
  } else {
    const idx = tempH[owner].indexOf(m.kind);
    if (idx !== -1) tempH[owner].splice(idx, 1);
    tempB[m.tr][m.tc] = { k: m.kind, o: owner };
  }

  return { tempB, tempH };
}

// 思考ルーチン実行
function aiTurn() {
  if (turn !== 'ai') return;

  const allMoves = getAllStrictLegalMoves('ai');

  if (allMoves.length === 0) {
    endGame('詰みました！あなたの勝ちです！ 🎉');
    return;
  }

  // アルファベータ法で全ての手に点数を付ける（深さ3手探索）
  const scored = allMoves.map(m => {
    const { tempB, tempH } = applyMove(board, hands, m, 'ai');
    return { m, score: minimax(tempB, tempH, 2, -Infinity, Infinity, false) };
  });
  const bestScore = Math.max(...scored.map(x => x.score));
  const bestMoves = scored.filter(x => x.score === bestScore).map(x => x.m);

  // 序盤は、最善とほぼ同じ点数の手の中から得意戦法の形に近づく手を選ぶ
  const nearBest = scored.filter(x => x.score >= bestScore - PLAN_MARGIN).map(x => x.m);
  const chosen = pickOpeningMove(nearBest) || bestMoves[Math.floor(Math.random() * bestMoves.length)];

  if (chosen.type === 'move') {
    const canPromote = (chosen.tr >= 6 || chosen.fr >= 6) && ['FU','KY','KE','GI','KA','HI'].includes(board[chosen.fr][chosen.fc].k);
    executeMove(chosen.fr, chosen.fc, chosen.tr, chosen.tc, canPromote);
  } else {
    const idx = hands.ai.indexOf(chosen.kind);
    hands.ai.splice(idx, 1);
    board[chosen.tr][chosen.tc] = { k: chosen.kind, o: 'ai' };
    recordMove('ai', chosen.kind, null, null, chosen.tr, chosen.tc, false, true);
  }

  selected = null; movable = []; render();

  if (!isKingOnBoard('player')) {
    endGame('王が取られました。あなたの負けです...');
    document.getElementById('status').style.color = '#c62828';
    return;
  }

  const playerMoves = getAllStrictLegalMoves('player');
  if (playerMoves.length === 0) {
    endGame('詰みました。あなたの負けです...');
    document.getElementById('status').style.color = '#c62828';
    return;
  }

  turn = 'player';
  const inCheck = isInCheck('player');
  if (inCheck) {
    showCheck();
    document.getElementById('status').textContent = '王手！あなたの番です';
  } else {
    document.getElementById('status').textContent = 'あなたの番です';
  }
  const found = announceStrategies(inCheck ? 1500 : 0);
  speakAfterMove('ai', found, inCheck);
  updateMood();
}

function judgeMood() {
  const score = -evaluateBoard(board, hands);
  if (score <= -2500) return 'doom';
  if (score <= -1000 || isInCheck('player')) return 'danger';
  if (score <= -600) return 'bad';
  if (score >= 600) return 'good';
  return 'even';
}

// ---- 対戦相手と得意戦法の序盤 ----
// 手順の各項目は「最初に home にいた駒を to へ」。座標はすべて相手（AI）から見た筋・段で書く
const OPPONENT_KEY = 'rakushogi-opponent';
const OPENING_PLAN_MOVES = 40; // この手数までは手順に沿って駒を組む
const PLAN_MARGIN = 60;        // 最善の手からこの点数差までなら、形を優先する（歩1枚は100点）
const step = (home, file, rank) => ({ home, to: [file, rank] });

const OPPONENTS = [
  { id: 'ginji', name: '銀次', style: '棒銀・舟囲い',
    intro: '居飛車で、銀を前に出してまっすぐ攻めてきます。',
    plan: [step('77', 7, 6), step('27', 2, 6), step('49', 5, 8), step('59', 6, 8), step('59', 7, 8),
           step('27', 2, 5), step('39', 3, 8), step('39', 2, 7), step('39', 2, 6), step('27', 2, 4)] },
  { id: 'omino', name: 'お美濃', style: '四間飛車・美濃囲い',
    intro: '玉をしっかり囲ってから、こちらの攻めを受け止めて反撃してきます。',
    plan: [step('77', 7, 6), step('67', 6, 6), step('28', 6, 8), step('59', 4, 8), step('59', 3, 8),
           step('59', 2, 8), step('39', 3, 8), step('69', 5, 8), step('17', 1, 6)] },
  { id: 'nakata', name: '中太', style: '中飛車・美濃囲い',
    intro: '飛車を真ん中に構えて、5筋から力強く攻めてきます。',
    plan: [step('57', 5, 6), step('77', 7, 6), step('28', 5, 8), step('59', 4, 8), step('59', 3, 8),
           step('59', 2, 8), step('39', 3, 8), step('57', 5, 5), step('79', 6, 8)] },
];

function aiView(r, c) { return { file: c + 1, rank: 9 - r }; }

// AIの駒に最初の位置を書いておく。駒は executeMove でオブジェクトごと動くので印も一緒に動く
function tagHomes() {
  for (let r = 0; r < 9; r++) for (let c = 0; c < 9; c++) {
    const p = board[r][c];
    if (p && p.o === 'ai') { const v = aiView(r, c); p.home = '' + v.file + v.rank; }
  }
}

function findHome(home) {
  for (let r = 0; r < 9; r++) for (let c = 0; c < 9; c++) {
    const p = board[r][c];
    if (p && p.o === 'ai' && p.home === home) return { r, c, ...aiView(r, c) };
  }
  return null; // 取られた駒
}

// 候補の手から、手順のまだ済んでいない項目に近づく手を1つ選ぶ。使える手がなければ null
function pickOpeningMove(candidates) {
  if (!opponent || kifu.length > OPENING_PLAN_MOVES) return null;
  const plan = opponent.plan;

  // 目標に着いた項目と、同じ駒のそれより前の項目を済みにする
  plan.forEach((s, i) => {
    const at = findHome(s.home);
    if (!at || at.file !== s.to[0] || at.rank !== s.to[1]) return;
    for (let j = 0; j <= i; j++) if (plan[j].home === s.home) planDone.add(j);
  });

  // 手順をすべて終えた駒は、組んだ形を崩さないよう動かさない
  const finished = home => plan.every((s, i) => s.home !== home || planDone.has(i));
  const usable = candidates.filter(m => m.type === 'move' && !(board[m.fr][m.fc].home && finished(board[m.fr][m.fc].home)));

  for (let i = 0; i < plan.length; i++) {
    if (planDone.has(i)) continue;
    const s = plan[i];
    const at = findHome(s.home);
    if (!at) continue;
    const dist = v => Math.max(Math.abs(v.file - s.to[0]), Math.abs(v.rank - s.to[1]));
    let best = null, bestDist = dist(at);
    for (const m of usable) {
      if (m.fr !== at.r || m.fc !== at.c) continue;
      const d = dist(aiView(m.tr, m.tc));
      if (d < bestDist) { bestDist = d; best = m; }
    }
    if (best) return best;
  }
  return null;
}

// 表示中のセリフより優先度が低いものは出さない（相手の手のすぐあとに大事なセリフが消えないように）
const SPEECH_PRIORITY = {
  aiWin: 9, aiLose: 9, giveCheck: 7, checked: 7, tookBig: 6, lostBig: 6, aiPromoted: 5, playerPromoted: 5,
  myStrategy: 4, playerStrategy: 4, tookSmall: 3, lostSmall: 3, start: 2, winning: 2, losing: 2, idle: 0,
};
const PIECE_SPEECH = { FU: '歩', KY: '香車', KE: '桂馬', GI: '銀', KI: '金', KA: '角', HI: '飛車', OU: '玉' };
const BIG_PIECES = ['HI', 'KA', 'KI', 'GI'];
let recentSpeech = [];
let speechShowing = null; // { priority, until }
let speechTimer = null;
let speechLevel = 0;      // 形勢の段階（あなた視点）。変わったときだけ「良くなった」「悪くなった」を言う

function say(event, vars = {}) {
  const lines = SPEECH[opponent.id][event];
  const priority = SPEECH_PRIORITY[event];
  if (speechShowing && Date.now() < speechShowing.until && priority < speechShowing.priority) return;
  const fresh = lines.filter(l => !recentSpeech.includes(l));
  const line = (fresh.length ? fresh : lines)[Math.floor(Math.random() * (fresh.length || lines.length))];
  recentSpeech = [line, ...recentSpeech].slice(0, 5);
  const text = line.replace('{p}', vars.p || '').replace('{s}', vars.s || '');

  const el = document.getElementById('speech');
  el.querySelector('.sp-name').textContent = opponent.name;
  el.querySelector('.sp-text').textContent = text;
  el.classList.add('show');
  const ms = Math.min(5000, Math.max(3000, 1800 + text.length * 120));
  speechShowing = { priority, until: Date.now() + ms };
  clearTimeout(speechTimer);
  speechTimer = setTimeout(() => { el.classList.remove('show'); speechShowing = null; }, ms);
}

function clearSpeech() {
  clearTimeout(speechTimer);
  speechShowing = null;
  speechLevel = 0;
  const el = document.getElementById('speech');
  if (el) el.classList.remove('show');
}

// あなた視点の点数を5段階にする（judgeMood と違い、王手かどうかは含めない）
function currentSpeechLevel() {
  const score = -evaluateBoard(board, hands);
  if (score >= 1500) return 2;
  if (score >= 600) return 1;
  if (score > -600) return 0;
  if (score > -1500) return -1;
  return -2;
}

// 1手指したあとに、いちばん大事な場面を1つ選んでしゃべる
function speakAfterMove(side, found, check) {
  const mine = side === 'ai';
  const cap = lastAction.side === side ? lastAction.captured : null;
  const strategy = found.find(f => f.side === side);
  const level = currentSpeechLevel();
  const levelChanged = level !== speechLevel;
  const levelUp = level > speechLevel; // あなたにとって良くなった
  speechLevel = level;

  if (check) return say(mine ? 'giveCheck' : 'checked');
  if (cap) return say((mine ? 'took' : 'lost') + (BIG_PIECES.includes(cap) ? 'Big' : 'Small'), { p: PIECE_SPEECH[cap] });
  if (lastAction.side === side && lastAction.promoted) return say(mine ? 'aiPromoted' : 'playerPromoted');
  if (strategy) return say(mine ? 'myStrategy' : 'playerStrategy', { s: strategy.name });
  if (levelChanged) return say(levelUp ? 'losing' : 'winning');
  if (mine && Math.random() < 1 / 3) say('idle');
}

// ---- 戦法・囲いの判定と表示 ----
// 盤面が決まった駒の配置になったら成立とみなす。座標はすべて「その陣営から見た筋・段」で書き、
// 後手（AI）は盤を180度回して同じ定義で判定する。
const OPENING_MOVES = 30; // 振り飛車などを序盤の形として認める手数

function viewOf(side) {
  const at = (file, rank) => {
    const r = side === 'player' ? rank - 1 : 9 - rank;
    const c = side === 'player' ? 9 - file : file - 1;
    const p = board[r][c];
    return p && p.o === side ? p.k : null;
  };
  const find = kind => {
    const list = [];
    for (let file = 1; file <= 9; file++) for (let rank = 1; rank <= 9; rank++) if (at(file, rank) === kind) list.push({ file, rank });
    return list;
  };
  const has = (kind, ...squares) => squares.some(([f, r]) => at(f, r) === kind);
  const rookOn = (file, minRank) => find('HI').some(p => p.file === file && p.rank >= minRank);
  return { at, find, has, rookOn, moves: kifu.length, opening: kifu.length <= OPENING_MOVES };
}

// 新しく成立した戦法を探し、表示の順番待ちに入れて、直前の手の棋譜に印を付ける
function announceStrategies(delay) {
  const found = [];
  for (const side of ['player', 'ai']) {
    const v = viewOf(side);
    for (const s of STRATEGIES) {
      if (announced[side].has(s.id) || !s.test(v)) continue;
      announced[side].add(s.id);
      found.push({ side, label: (side === 'player' ? 'あなた' : opponent.name) + 'の' + s.type, name: s.name, aim: s.aim });
    }
  }
  for (const m of MATCHUPS) {
    if (announced.both.has(m.id) || !m.test()) continue;
    announced.both.add(m.id);
    found.push({ side: 'both', label: '戦型', name: m.name, aim: m.aim });
  }
  if (found.length === 0) return found;

  const last = kifu[kifu.length - 1];
  if (last) { last.tags = (last.tags || []).concat(found.map(f => f.name)); renderKifu(); }
  strategyLog.push(...found);
  renderStrategyNote(found[found.length - 1]);
  strategyQueue.push(...found);
  if (!strategyPlaying) { strategyPlaying = true; strategyTimer = setTimeout(playNextStrategy, delay); }
  return found;
}

const STRATEGY_MS = 1800; // 盤の上に名前を出しておく時間
let strategyLog = [];      // この対局でできた戦法（戦法メモに並べる）
let strategyQueue = [];
let strategyPlaying = false;
let strategyTimer = null;
let strategyShownAt = 0;

function playNextStrategy() {
  const el = document.getElementById('strategy-banner');
  el.classList.remove('show', 'out');
  const item = strategyQueue.shift();
  if (!item) { strategyPlaying = false; return; }

  el.className = item.side;
  el.querySelector('.st-label').textContent = item.label;
  const nameEl = el.querySelector('.st-name');
  nameEl.textContent = item.name;
  // 名前の長さに合わせて、盤の幅に収まる大きさにする
  nameEl.style.fontSize = 'calc(var(--board-size) * ' + Math.min(0.12, 0.8 / item.name.length) + ')';
  void el.offsetWidth; // 続けて表示するときも毎回アニメーションが最初から再生されるようにする
  el.classList.add('show');
  strategyShownAt = Date.now();
  strategyTimer = setTimeout(closeStrategy, STRATEGY_MS);
}

// 薄く消してから次の戦法へ進む
function closeStrategy() {
  document.getElementById('strategy-banner').classList.add('out');
  strategyTimer = setTimeout(playNextStrategy, 250);
}

// 表示中に画面を触ったら、早めに閉じて次へ進む
function dismissStrategy() {
  const el = document.getElementById('strategy-banner');
  if (!el.classList.contains('show') || el.classList.contains('out')) return;
  if (Date.now() - strategyShownAt < 600) return; // 戦法を成立させた手のタップでは閉じない
  clearTimeout(strategyTimer);
  closeStrategy();
}

// 戦法メモを描く。上に選んだ戦法の名前と狙い、下にこの対局でできた戦法を並べ、押すとその説明に切りかわる
function renderStrategyNote(current) {
  const el = document.getElementById('strategy-note');
  el.innerHTML = '';
  if (!current) {
    const empty = document.createElement('div');
    empty.className = 'note-empty';
    empty.textContent = '戦法や囲いができると、ここに狙いが出ます。';
    el.appendChild(empty);
    return;
  }
  const box = document.createElement('div');
  box.className = 'note-current ' + current.side;
  box.innerHTML = '<div class="note-head"><span class="note-name"></span><span class="note-label"></span></div><div class="note-aim"></div>';
  box.querySelector('.note-name').textContent = current.name;
  box.querySelector('.note-label').textContent = current.label;
  box.querySelector('.note-aim').textContent = current.aim;
  el.appendChild(box);

  const chips = document.createElement('div');
  chips.className = 'note-chips';
  if (strategyLog.length > 1) {
    strategyLog.forEach(item => {
      const b = document.createElement('button');
      b.className = 'note-chip ' + item.side + (item === current ? ' active' : '');
      b.textContent = item.name;
      b.onclick = () => renderStrategyNote(item);
      chips.appendChild(b);
    });
  }
  el.appendChild(chips);
}

function clearStrategyBanner() {
  clearTimeout(strategyTimer);
  strategyLog = [];
  renderStrategyNote(null);
  strategyQueue = [];
  strategyPlaying = false;
  const el = document.getElementById('strategy-banner');
  if (el) el.classList.remove('show', 'out');
}

// 「王手」を筆文字で盤の上に重ねて表示する
function showCheck() {
  const el = document.getElementById('check-banner');
  el.classList.remove('show');
  void el.offsetWidth; // 連続して王手がかかっても毎回アニメーションが再生されるようにする
  el.classList.add('show');
}

function render() {
  const boardEl = document.getElementById('board');
  boardEl.innerHTML = '';

  for (let r = 0; r < 9; r++) {
    for (let c = 0; c < 9; c++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      const p = board[r][c];

      if (movable.some(m => m.r === r && m.c === c)) cell.classList.add('movable');
      if (selected && selected.r === r && selected.c === c) cell.classList.add('selected');
      if (lastMoves.player && lastMoves.player.r === r && lastMoves.player.c === c) cell.classList.add('last-player');
      if (lastMoves.ai && lastMoves.ai.r === r && lastMoves.ai.c === c) cell.classList.add('last-ai');

      if (p) {
        cell.textContent = KINDS[p.k];
        cell.classList.add(p.o === 'ai' ? 'ai-piece' : 'player-piece');
        if (['TO','NY','NK','NG','UM','RY'].includes(p.k)) cell.classList.add('promoted');
      }

      cell.onclick = () => handleCellClick(r, c);
      boardEl.appendChild(cell);
    }
  }

  const pHandEl = document.getElementById('player-hand');
  const aHandEl = document.getElementById('ai-hand');
  pHandEl.innerHTML = ''; aHandEl.innerHTML = '';

  hands.player.forEach((k, idx) => {
    const el = document.createElement('div');
    el.className = 'hand-piece player-piece';
    if (selected && selected.handIndex === idx) el.classList.add('selected');
    el.textContent = KINDS[k];
    el.onclick = (e) => { e.stopPropagation(); selectHand(idx); };
    pHandEl.appendChild(el);
  });

  hands.ai.forEach((k) => {
    const div = document.createElement('div');
    div.className = 'hand-piece ai-piece';
    div.textContent = KINDS[k];
    aHandEl.appendChild(div);
  });
}

if (document.fonts && document.fonts.load) document.fonts.load('40px "Yuji Syuku"');
document.addEventListener('click', dismissStrategy);
document.getElementById('name-input').addEventListener('keydown', e => { if (e.key === 'Enter') handleNameSubmit(true); });
applyFxSetting();
opponent = loadOpponent() || OPPONENTS[0];
applyOpponentLabels();
loadRanking(opponent);
resetGame();
openOpponentModal(false);
</script>
